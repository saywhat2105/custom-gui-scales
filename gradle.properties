org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
org.gradle.parallel=true
org.gradle.caching=true

# Mod metadata
mod_id=customguiscales
mod_name=Custom GUI Scales
mod_license=MIT
mod_version=1.0.1
mod_group_id=com.saywhat.customguiscales
mod_authors=saywhat
mod_description=Render individual HUD elements at their own GUI scale. Set independent scales for the hotbar, tooltips, experience bar, health, hunger, armor and air - all from an in-game config screen.

# Minecraft
minecraft_version=1.21.1
minecraft_version_range=[1.21.1,1.21.2)

# NeoForge - check https://projects.neoforged.net/neoforged/neoforge for the latest 21.1.x build
# and bump neo_version if this exact build is no longer on the maven.
neo_version=21.1.93
neo_version_range=[21.1.0,)
loader_version_range=[4,)

# Parchment human-readable mappings (optional). Remove the parchment{} block in build.gradle
# if a matching release is unavailable for your setup.
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17
